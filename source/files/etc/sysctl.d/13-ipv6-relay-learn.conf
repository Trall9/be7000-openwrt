# IPv6 relay (odhcpd ndp=relay) без IA_PD у провайдера: ядро по умолчанию не создаёт
# neighbor-запись по незапрошенному NA клиента (accept_untracked_na=0) → odhcpd не узнаёт
# GUA клиента в LAN, ответы из интернета уходят на wan. default — т.к. br-lan создаётся
# позже, чем применяется sysctl.
net.ipv6.conf.default.accept_untracked_na=1
